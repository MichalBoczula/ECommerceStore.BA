services:
  mongo:
    image: mongo:8.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongo-data:/data/db
  api:
    build: .
    environment:
      BA_API_KEY: ${BA_API_KEY:?Set BA_API_KEY before starting Compose}
      BA_MONGODB_URI: mongodb://mongo:27017
      BA_KNOWLEDGE_API_URL:
      BA_KNOWLEDGE_API_KEY:
      BA_FOUNDRY_PROJECT_ENDPOINT:
      BA_FOUNDRY_AGENT_NAME:
      BA_FOUNDRY_AGENT_VERSION:
      BA_FOUNDRY_MAX_OUTPUT_TOKENS:
      BA_JIRA_SITE_URL:
      BA_JIRA_API_URL:
      BA_JIRA_EMAIL:
      BA_JIRA_API_TOKEN:
      BA_JIRA_PROJECT_KEY:
      BA_JIRA_ISSUE_TYPE_ID:
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
volumes:
  mongo-data:

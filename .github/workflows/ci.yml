name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Match the MongoDB 8.0 runner used by Payments (SERVER-121912).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.0
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
      - run: uv python install
      - run: bash scripts/ci.sh
      - run: docker compose config --quiet
        env:
          BA_API_KEY: ci-build-only
      - run: docker build -t ecommerce-store-ba:ci .
      - name: Publish the verified BA image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USER"
          test -n "$DOCKER_TOKEN"
          image="docker.io/${DOCKER_USER}/ecommerce-store-ba"
          version="${image}:${GITHUB_SHA}"
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin
          docker tag ecommerce-store-ba:ci "$version"
          docker push "$version"
          digest_reference="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$version" | awk -F@ '/\/ecommerce-store-ba@sha256:/ {print $2; exit}')"
          [[ "$digest_reference" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p artifacts
          jq -n --arg image "${image}@${digest_reference}" --arg commit "$GITHUB_SHA" \
            '{application: "ba", imageReference: $image, commitSha: $commit}' > artifacts/image-reference.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: image-reference
          path: artifacts/image-reference.json
          if-no-files-found: error
